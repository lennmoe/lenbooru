services:
  lenbooru:
    build: .
    image: lenbooru
    container_name: lenbooru
    restart: unless-stopped
    # Left = port on the VPS, right = port in the container (do not change 3000).
    # Use "80:3000" to serve on http://<IP>  (then set AUTH_URL without :3000)
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      # SQLite DB + all uploaded media live here, on the host — this is your data.
      - ./data:/app/data
